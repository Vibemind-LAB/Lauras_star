# Laura on-prem / server stack (docs/14-enterprise.md).
#
# The API currently uses the embedded SQLite store (volume `laura-data`). The
# Postgres / Redis / Qdrant / MinIO services below are the collaboration-plane
# infrastructure (report: "Optional Collaboration Plane") wired and ready for the
# server-mode backends (extras: psycopg/celery/qdrant). Bring up just `api` for a
# minimal deployment.

services:
  api:
    build:
      context: ../services/local-api
    # Ohne Regel kommt der Dienst nach einem Docker-Neustart nicht wieder:
    # gemessen 04.09.2026 waren alle laura-Container zurueck, nur dieser
    # fehlte — und der Marketing-Agent meldete "Laura nicht erreichbar",
    # obwohl nichts kaputt war. Die Datendienste unten halten ihre Daten in
    # Volumes und werden bei Bedarf mitgestartet; dieser hier ist der, den
    # von aussen jemand erwartet.
    restart: unless-stopped
    environment:
      LAURA_HOST: 0.0.0.0
      LAURA_PORT: "8765"
      LAURA_WORKSPACE: /data/workspace
      LAURA_TOKEN: ${LAURA_TOKEN:-}
      # Server-mode targets (used once the server backends are enabled).
      # DATABASE_URL bleibt auskommentiert: create_database() waehlt allein anhand
      # dieser Variable Postgres statt SQLite (db/database.py:17-23) und importiert
      # dann psycopg, das nur im Extra `server` steckt — das Image baut mit
      # `uv sync --frozen --no-dev` ohne Extras und stuerzt beim Start ab.
      # Der Kopf dieser Datei sagt es selbst: der Dienst laeuft auf SQLite.
      # Einschalten heisst: Zeile aktivieren UND das Image mit --extra server bauen.
      # DATABASE_URL: postgresql://laura:laura@postgres:5432/laura
      # REDIS_URL und QDRANT_URL liest heute kein Code — reine Vorausplanung.
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8765:8765"
    volumes:
      - laura-data:/data
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laura
      POSTGRES_PASSWORD: laura
      POSTGRES_DB: laura
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: laura
      MINIO_ROOT_PASSWORD: laura-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  laura-data:
  pg-data:
  qdrant-data:
  minio-data:
