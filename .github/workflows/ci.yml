name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: local-api (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/local-api
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync (scene extra for shot-detection, otel for tracing tests)
        run: uv sync --frozen --extra scene --extra otel

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  desktop:
    name: desktop (typecheck, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      # tsc + vite renderer build don't need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build renderer
        run: pnpm build:renderer

      - name: Test (vitest)
        run: pnpm test
