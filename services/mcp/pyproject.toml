[project]
name = "laura-mcp"
version = "0.1.0"
description = "MCP server exposing the local Laura app (127.0.0.1:8765) to Claude sessions."
requires-python = ">=3.11"
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.scripts]
laura-mcp = "laura_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laura_mcp"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
