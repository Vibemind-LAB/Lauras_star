[project]
name = "laura-local-api"
version = "0.1.0"
description = "Laura local service: frame-/sample-accurate timebase, ingest, analysis, interchange."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "opentimelineio>=0.17",      # canonical editorial interchange model (ADR-0001)
    "prometheus-client>=0.20",   # observability metrics (docs/10, docs/14)
]

# Heavy ML components are OPTIONAL extras — the backend must start and do
# ingest/probe/proxy/waveform/export without any of these installed.
[project.optional-dependencies]
scene = ["scenedetect>=0.6.4", "opencv-python>=4.9"]
# Learned shot detector (TransNetV2). Heavy second engine; torch comes via align/diarize.
scene-ml = ["transnetv2-pytorch>=1.0.5"]
asr = ["faster-whisper>=1.0"]
align = ["whisperx>=3.1", "torch>=2.8", "torchaudio>=2.8"]   # version-sensitive — pin hard, isolate
diarize = ["pyannote.audio>=3.1", "torch>=2.8", "torchaudio>=2.8"]
# Server / on-prem mode (docs/14-enterprise.md) — not needed for desktop.
server = [
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "qdrant-client>=1.11",
]
# Optional OpenTelemetry tracing (docs/10) — backend runs without it (no-op spans).
otel = [
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
]
semantic = [
    "fastembed>=0.8.0",
    "qdrant-client>=1.18.0",
]

[project.scripts]
laura-api = "laura.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laura"]

# torch/torchaudio resolve from the CUDA wheel index so the GPU is used where present.
# Only the diarize/align extras pull torch; CPU-only hosts still work (the cu128 build
# runs on CPU). CI installs neither extra, so it is unaffected.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# Optional ML components ship no type stubs and may be absent in the base env.
[[tool.mypy.overrides]]
module = [
    "scenedetect.*", "faster_whisper.*", "whisperx.*", "pyannote.*", "cv2.*",
    "opentimelineio.*", "celery.*", "qdrant_client.*", "psycopg.*", "opentelemetry.*",
    "torch.*", "numpy.*", "fastembed.*", "transnetv2_pytorch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
